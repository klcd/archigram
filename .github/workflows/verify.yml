name: Verify (8 Gates)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ArchiGram 8-Gate Verification & Zero-Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Provision frozen uv environment inside Nix devShell
        run: nix develop --command uv sync --frozen

      - name: Run all 8 ArchiGram quality & zero-drift gates
        run: nix develop --command ./scripts/verify.sh

      - name: Verify UML 2.5 showcase & 3-stage triage parity
        run: nix develop --command env IN_NIX_SHELL=1 just docs-check
