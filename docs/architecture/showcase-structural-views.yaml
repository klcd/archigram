schema_version: '1.0'
global_abstractions: []
views:
- id: showcase_cli_triage
  title: 'Showcase: CLI-Curated Compilation Pipeline (d2)'
  ir_mode: structural_graph
  target_renderer: d2
  diagram_variant: architecture
  render_svg: true
  animate_edges: null
  rules:
  - op: prune_leaves
    id: prune_ns_stubs
    node_id_globs:
    - archigram
    - archigram.entrypoints
    - archigram.entrypoints.cli
    - archigram.features
    direction: both
  - op: bypass_vertices
    id: splice_reexport_barrels
    node_id_globs:
    - archigram.ports
    - archigram.ports.contracts
    - archigram.domain
    - archigram.features.emit_mermaid
    - archigram.features.emit_d2
    - archigram.features.emit_plantuml
    - archigram.features.emit_likec4
    preserve_edge_relations: []
    preserve_concurrency_kind: true
    max_fanout_product: 250
  - op: collapse_partition
    id: fold_ingestors
    target_node_id: ingestor_slices
    label: Ingestor Slices (5 Extractors)
    summary: ''
    member_globs:
    - archigram.features.ingest_*
    exclude_ids: []
  - op: collapse_partition
    id: fold_reducers
    target_node_id: reducer_slices
    label: Reducer Slices (Graph & Trace)
    summary: ''
    member_globs:
    - archigram.features.reduce_*
    exclude_ids: []
  - op: collapse_partition
    id: fold_linters
    target_node_id: linter_slices
    label: 5-Gate Linter Slices
    summary: ''
    member_globs:
    - archigram.features.lint_*
    exclude_ids: []
  - op: collapse_partition
    id: fold_emitters
    target_node_id: emitter_slices
    label: Multi-Target Emitter Slices
    summary: ''
    member_globs:
    - archigram.features.emit_*.emitter*
    - archigram.features.emit_*.uml_variants*
    exclude_ids: []
  - op: collapse_partition
    id: fold_domain_core
    target_node_id: domain_core
    label: Domain Core (Canonical IR, Spec, Diagnostics)
    summary: ''
    member_globs:
    - archigram.domain.ir*
    - archigram.domain.spec*
    - archigram.domain.diagnostics*
    exclude_ids: []
  - op: collapse_partition
    id: fold_cli_callers
    target_node_id: cli_commands
    label: CLI Commands (app, triage, diff, sync)
    summary: ''
    member_globs:
    - archigram.entrypoints.cli.app*
    - archigram.entrypoints.cli.triage*
    - archigram.entrypoints.cli.diff*
    - archigram.entrypoints.cli.markdown_sync*
    - archigram.entrypoints.cli.self_trace*
    - archigram.entrypoints.cli.curate_cli*
    exclude_ids: []
  - op: collapse_partition
    id: fold_digest
    target_node_id: digest_slice
    label: Digest Slice (Graph & Trace)
    summary: ''
    member_globs:
    - archigram.features.digest*
    exclude_ids: []
  - op: collapse_partition
    id: fold_domain_style
    target_node_id: domain_style
    label: Canonical Dual-Mode Style Policy (domain.style)
    summary: ''
    member_globs:
    - archigram.domain.style*
    exclude_ids: []
  scope:
    mode: k_hop_neighborhood
    focal_nodes:
    - archigram.entrypoints.cli.pipeline
    upstream_depth: 1
    downstream_depth: 1
  simplify:
    condense_sccs: true
    transitive_reduction: true
  trace_compaction:
    fold_loops: true
    fold_loop_with_opt: true
    cut_recursion: true
    fold_parallel_siblings: true
    parallel_epsilon_ns: 1000000
    fold_parallel_map: true
    max_par_branches: 6
    decompose_series_parallel: true
    max_call_depth: 8
  invariants:
    protected_nodes: []
    preserve_reachability: []
    preserve_partial_order: true
    forbid_new_cycles: true
    node_budget:
      min_count: 5
      max_count: 18
    edge_budget_max: 40
    overflow_strategy: fail
