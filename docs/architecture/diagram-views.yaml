# ArchiGram Self-Hosted Structural Curation Spec (CurationSpecV1)
# Compiled directly against `src/archigram` via:
#   uv run archigram apply src/archigram \
#     --spec docs/architecture/diagram-views.yaml \
#     --out-dir docs/architecture/diagrams \
#     --sync-md docs/architecture
schema_version: '1.0'
metadata:
  project: ArchiGram
  purpose: Multi-level self-hosted architecture views (L0 Hexagonal Rings -> L1 Feature Slices -> L2 Subsystems)

global_abstractions:
  # Prune top-level namespace package stubs that only serve as Python containment anchors
  - op: prune_leaves
    id: prune_namespace_roots
    node_id_globs:
      - archigram
      - archigram.entrypoints
      - archigram.features
    direction: both

views:
  # ============================================================================
  # LEVEL 0: System & Hexagonal Rings (9 Supernodes)
  # ============================================================================
  - id: l0_hexagonal_rings_mermaid
    title: "L0: ArchiGram Hexagonal Rings & Capability Groups (Mermaid)"
    ir_mode: structural_graph
    target_renderer: mermaid
    scope:
      mode: full
    rules:
      - op: collapse_partition
        id: l0_mmd_cli_dataplane
        target_node_id: cli_dataplane
        label: "CLI Data Plane (entrypoints.cli)"
        summary: "Zero-LLM deterministic apply, lint, diff, markdown_sync & self_trace"
        member_globs:
          - archigram.entrypoints.cli
          - archigram.entrypoints.cli.*
      - op: collapse_partition
        id: l0_mmd_mcp_controlplane
        target_node_id: mcp_controlplane
        label: "MCP Control Plane (entrypoints.mcp)"
        summary: "MCP server tools & bounded 3-turn self-healing repair loop"
        member_globs:
          - archigram.entrypoints.mcp
          - archigram.entrypoints.mcp.*
      - op: collapse_partition
        id: l0_mmd_feature_ingestors
        target_node_id: feature_ingestors
        label: "Ingestor Slices (DOT, SCIP, OTLP, Class, Python)"
        summary: "5 independent factual extractors emitting OBSERVED Canonical IR"
        member_globs:
          - archigram.features.ingest_*
      - op: collapse_partition
        id: l0_mmd_feature_reducers
        target_node_id: feature_reducers
        label: "Reducer Slices (Structural + Trace Compactor)"
        summary: "Topological graph reduction & R1-R6 + SP-Poset trace compaction"
        member_globs:
          - archigram.features.reduce_*
      - op: collapse_partition
        id: l0_mmd_feature_linters
        target_node_id: feature_linters
        label: "5-Gate Linter Slices (Grounding, Topology, Budget, Syntax)"
        summary: "Mathematical verification gates with witness paths & repair hints"
        member_globs:
          - archigram.features.lint_*
      - op: collapse_partition
        id: l0_mmd_feature_emitters
        target_node_id: feature_emitters
        label: "Emitter Slices (Mermaid, D2, PlantUML, LikeC4)"
        summary: "4 deterministic multi-target renderers"
        member_globs:
          - archigram.features.emit_*
      - op: collapse_partition
        id: l0_mmd_feature_digest
        target_node_id: feature_digest
        label: "Digest Slice (Graph & Trace Digest)"
        summary: "Token-efficient Louvain/PageRank/hotspot digests for MCP"
        member_globs:
          - archigram.features.digest
          - archigram.features.digest.*
      - op: collapse_partition
        id: l0_mmd_ports_contracts
        target_node_id: ports_contracts
        label: "Ports & Contracts (archigram.ports)"
        summary: "Hexagonal Protocol interfaces isolating feature slices"
        member_globs:
          - archigram.ports
          - archigram.ports.*
      - op: collapse_partition
        id: l0_mmd_domain_core
        target_node_id: domain_core
        label: "Domain Core (Canonical IR, Spec, Poset, Diagnostics)"
        summary: "Zero-I/O pure Pydantic v2 value objects and concurrency math"
        member_globs:
          - archigram.domain
          - archigram.domain.*
    simplify:
      condense_sccs: true
      transitive_reduction: true
    invariants:
      protected_nodes:
        - cli_dataplane
        - mcp_controlplane
        - ports_contracts
        - domain_core
      preserve_reachability:
        - from_node: archigram.entrypoints.cli.pipeline
          to_node: archigram.ports.contracts
        - from_node: archigram.ports.contracts
          to_node: archigram.domain.ir
        - from_node: archigram.entrypoints.cli.pipeline
          to_node: archigram.domain.ir
      forbid_new_cycles: true
      node_budget:
        min_count: 6
        max_count: 12
      edge_budget_max: 40

